name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/ubuntu/green-shipping-ai-server

jobs:
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh ${EC2_USER}@${EC2_HOST} << 'ENDSSH'
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd ${{ env.DEPLOY_PATH }}
            
            # Pull latest code
            echo "📥 Pulling latest code from ${{ github.ref_name }}..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Stop containers
            echo "🛑 Stopping containers..."
            docker-compose down
            
            # Build new images
            echo "🔨 Building Docker images..."
            docker-compose build --no-cache
            
            # Start containers
            echo "🚀 Starting containers..."
            docker-compose up -d
            
            # Wait for services to be healthy
            echo "⏳ Waiting for services to be healthy..."
            sleep 10
            
            # Check service status
            echo "📊 Checking service status..."
            docker-compose ps
            
            # Health check
            echo "🏥 Running health check..."
            for i in {1..30}; do
              if curl -f http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                break
              fi
              echo "Waiting for service to be ready... ($i/30)"
              sleep 2
            done
            
            # Show logs
            echo "📋 Recent logs:"
            docker-compose logs --tail=50
            
            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Service URL: http://${{ secrets.EC2_HOST }}:8000"
          echo "📚 API Docs: http://${{ secrets.EC2_HOST }}:8000/docs"
          echo "🏥 Health Check: http://${{ secrets.EC2_HOST }}:8000/health"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."
